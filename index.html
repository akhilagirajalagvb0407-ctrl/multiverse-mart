<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiverse Mart | Hero Merchandise Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --paper:#FFF3C4;      /* old comic newsprint */
  --ink:#000;           /* panel outlines */
  --red:#E8262C;
  --blue:#1C4CD1;
  --yellow:#FFD000;
  --green:#1E9E4A;
  --white:#fff;
  --display:'Bangers', Impact, 'Arial Black', sans-serif;
  --body:'Archivo', 'Segoe UI', Arial, sans-serif;
  --panel-border:4px solid var(--ink);
  --panel-shadow:6px 6px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--body);color:var(--ink);line-height:1.5;
  background-color:var(--paper);
  /* Ben-Day halftone dots = printed comic feel */
  background-image:radial-gradient(rgba(232,38,44,.18) 1.4px, transparent 1.5px);
  background-size:14px 14px;
  min-height:100vh;display:flex;flex-direction:column;
}
a{color:inherit}
button,input,select{font-family:inherit;font-size:1rem}
:focus-visible{outline:3px dashed var(--blue);outline-offset:3px}
.wrap{width:min(1180px,92%);margin:0 auto}
main{flex:1;padding:32px 0 60px}

/* ============ COMIC PRIMITIVES ============ */
.panel{background:var(--white);border:var(--panel-border);box-shadow:var(--panel-shadow)}
.btn{
  font-family:var(--display);font-size:1.35rem;letter-spacing:1px;
  padding:10px 22px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  background:var(--yellow);cursor:pointer;transition:transform .08s, box-shadow .08s;
  text-decoration:none;display:inline-block;color:var(--ink)
}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn.red{background:var(--red);color:var(--white)}
.btn.blue{background:var(--blue);color:var(--white)}
.btn.ghost{background:var(--white)}
.btn:disabled{opacity:.5;cursor:not-allowed}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:1px;line-height:1.05}
h2{font-size:clamp(2rem,4vw,2.8rem);margin-bottom:18px}
.caption{ /* the yellow narration box used in comics */
  display:inline-block;background:var(--yellow);border:3px solid var(--ink);
  padding:4px 12px;font-weight:800;font-size:.9rem
}

/* ============ HEADER ============ */
header{background:var(--red);border-bottom:var(--panel-border);position:sticky;top:0;z-index:50}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;flex-wrap:wrap}
.logo{
  font-family:var(--display);font-size:2.1rem;color:var(--yellow);text-decoration:none;
  -webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)
}
.nav-links{display:flex;gap:6px;list-style:none;align-items:center}
.nav-links a{
  color:var(--white);text-decoration:none;font-weight:800;padding:6px 12px;border:3px solid transparent
}
.nav-links a:hover,.nav-links a.active{border-color:var(--ink);background:var(--blue)}
.cart-btn{position:relative;background:var(--white);padding:8px 14px}
.cart-count{
  position:absolute;top:-12px;right:-12px;background:var(--yellow);border:3px solid var(--ink);
  border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:800;font-size:.85rem
}

/* ============ HERO (SPLASH PAGE) ============ */
.splash{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:auto auto;gap:18px;margin-bottom:48px}
.splash-main{
  grid-row:span 2;padding:40px;position:relative;overflow:hidden;
  background:var(--blue);color:var(--white);transform:rotate(-.6deg)
}
.splash-main::before{ /* speed lines */
  content:"";position:absolute;inset:-50%;
  background:repeating-conic-gradient(from 0deg at 80% 50%, rgba(255,255,255,.09) 0 4deg, transparent 4deg 12deg);
}
.splash-main > *{position:relative}
.splash-main h1{
  font-size:clamp(2.8rem,7vw,5.4rem);color:var(--yellow);
  -webkit-text-stroke:2px var(--ink);text-shadow:5px 5px 0 var(--ink);margin:16px 0
}
.splash-main p{max-width:46ch;font-size:1.1rem;margin-bottom:24px}
.splash-side{padding:22px;display:flex;flex-direction:column;justify-content:center}
.splash-side:nth-child(2){background:var(--yellow);transform:rotate(1.2deg)}
.splash-side:nth-child(3){background:var(--red);color:var(--white);transform:rotate(-1deg)}
.splash-side h3{font-size:2rem}
.bubble{ /* speech bubble */
  position:relative;background:var(--white);color:var(--ink);border:3px solid var(--ink);
  border-radius:24px;padding:10px 16px;font-weight:800;display:inline-block
}
.bubble::after{
  content:"";position:absolute;left:28px;bottom:-16px;border:8px solid transparent;
  border-top:10px solid var(--ink);
}

/* ============ HERO CHIPS ============ */
.hero-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:48px}
.hero-chip{
  display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;background:var(--white);
  border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-weight:800;text-decoration:none
}
.hero-chip span{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.1rem}

/* ============ PRODUCT GRID ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px}
.card{display:flex;flex-direction:column;position:relative}
.card .art{aspect-ratio:1;border-bottom:var(--panel-border);cursor:pointer;display:block}
.card .art svg{width:100%;height:100%;display:block}
.card-body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-body h3{font-family:var(--body);font-weight:800;font-size:1.02rem;letter-spacing:0;line-height:1.3}
.card-body h3 a{text-decoration:none}
.tag{font-size:.78rem;font-weight:800;padding:2px 8px;border:2px solid var(--ink);align-self:flex-start;color:#fff}
.price{font-family:var(--display);font-size:1.7rem}
.mrp{text-decoration:line-through;opacity:.55;font-size:.95rem;margin-left:6px;font-family:var(--body)}
.card-actions{display:flex;gap:8px;margin-top:auto}
.card-actions .btn{font-size:1.05rem;padding:6px 12px;flex:1}
.badge-sale{
  position:absolute;top:-14px;right:-10px;background:var(--yellow);border:3px solid var(--ink);
  font-family:var(--display);font-size:1.2rem;padding:6px 10px;transform:rotate(8deg);z-index:2
}

/* ============ SHOP LAYOUT ============ */
.shop{display:grid;grid-template-columns:250px 1fr;gap:28px;align-items:start}
.filters{padding:20px;position:sticky;top:96px}
.filters h3{font-size:1.5rem;margin:14px 0 8px}
.filters h3:first-child{margin-top:0}
.filters label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.field{width:100%;padding:10px 12px;border:3px solid var(--ink);background:var(--white)}
.toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.toolbar .field{flex:1;min-width:200px}
.toolbar select.field{flex:0 0 200px}

/* ============ PRODUCT DETAIL ============ */
.pdp{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.pdp .art{aspect-ratio:1}
.pdp .art svg{width:100%;height:100%;display:block}
.pdp h1{font-size:clamp(2.2rem,4vw,3.2rem);margin:10px 0}
.pdp-info{padding:28px}
.stars{color:#E8A400;font-size:1.2rem;letter-spacing:2px}
.opts{display:flex;gap:8px;margin:8px 0 18px;flex-wrap:wrap}
.opt{padding:8px 14px;border:3px solid var(--ink);background:var(--white);cursor:pointer;font-weight:800}
.opt.sel{background:var(--ink);color:var(--yellow)}
.qty{display:inline-flex;border:3px solid var(--ink);background:var(--white)}
.qty button{width:40px;border:none;background:var(--yellow);font-weight:800;font-size:1.2rem;cursor:pointer}
.qty span{width:48px;display:grid;place-items:center;font-weight:800}
.features{list-style:none;margin:16px 0}
.features li{padding:4px 0 4px 26px;position:relative}
.features li::before{content:"★";position:absolute;left:0;color:var(--red)}
.back{display:inline-block;margin-bottom:18px;font-weight:800}

/* ============ CART & CHECKOUT ============ */
.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;align-items:start}
.cart-item{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;padding:14px;border-bottom:3px dashed var(--ink)}
.cart-item:last-child{border-bottom:none}
.cart-item .thumb{width:90px;height:90px;border:3px solid var(--ink)}
.cart-item .thumb svg{width:100%;height:100%;display:block}
.remove{background:none;border:none;color:var(--red);font-weight:800;cursor:pointer;text-decoration:underline;margin-top:6px}
.summary{padding:22px;position:sticky;top:96px}
.row{display:flex;justify-content:space-between;padding:6px 0}
.row.total{border-top:3px solid var(--ink);margin-top:8px;padding-top:12px;font-family:var(--display);font-size:1.7rem}
.coupon{display:flex;gap:8px;margin:14px 0}
.coupon .btn{font-size:1rem;padding:6px 14px}
.empty{padding:50px;text-align:center}
.empty h2{margin-bottom:10px}

.steps{display:flex;list-style:none;gap:0;margin-bottom:28px;counter-reset:s;flex-wrap:wrap}
.steps li{counter-increment:s;flex:1;min-width:120px;padding:10px;text-align:center;font-weight:800;border:3px solid var(--ink);background:var(--white);margin-left:-3px}
.steps li::before{content:counter(s) ". "}
.steps li.done{background:var(--green);color:#fff}
.steps li.now{background:var(--yellow)}
.form-panel{padding:24px;margin-bottom:24px}
.form-panel h3{font-size:1.7rem;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.form-grid label{font-weight:800;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.err{color:var(--red);font-size:.82rem;font-weight:800;min-height:1em}
.field.bad{border-color:var(--red);background:#FFE7E7}

.tabs{display:flex;margin-bottom:18px;flex-wrap:wrap}
.tab{flex:1;padding:12px;border:3px solid var(--ink);background:var(--white);font-weight:800;cursor:pointer;margin-left:-3px}
.tab.on{background:var(--blue);color:#fff}
.card-preview{
  width:min(340px,100%);aspect-ratio:1.586;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);
  background:linear-gradient(135deg,var(--red),#8E0F14);color:#fff;padding:18px;margin-bottom:18px;
  display:flex;flex-direction:column;justify-content:space-between;font-weight:800;position:relative;overflow:hidden
}
.card-preview .num{font-size:1.25rem;letter-spacing:2px;font-family:monospace}
.card-preview .chip{width:42px;height:32px;background:var(--yellow);border:2px solid var(--ink);border-radius:5px}
.card-preview .brand{position:absolute;top:16px;right:18px;font-family:var(--display);font-size:1.4rem}
.upi-apps{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.upi-apps .opt{flex:1;min-width:100px;text-align:center}
.qr{width:150px;height:150px;border:3px solid var(--ink);margin:10px 0;background:#fff}
.cod-note{padding:14px;border:3px dashed var(--ink);background:var(--paper)}

/* ============ OVERLAY / SUCCESS ============ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:100;padding:20px}
.overlay .panel{padding:36px;text-align:center;max-width:420px;width:100%}
.spinner{width:70px;height:70px;border:8px solid var(--paper);border-top-color:var(--red);border-radius:50%;margin:0 auto 18px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.success-hero{padding:40px;text-align:center;background:var(--green);color:#fff;margin-bottom:28px}
.success-hero h1{font-size:clamp(3rem,8vw,5.5rem);color:var(--yellow);-webkit-text-stroke:2px var(--ink);text-shadow:5px 5px 0 var(--ink)}
.track{display:flex;list-style:none;margin:20px 0;flex-wrap:wrap}
.track li{flex:1;min-width:110px;text-align:center;padding:10px 4px;border-top:6px solid #bbb;font-weight:800;font-size:.9rem}
.track li.done{border-color:var(--green)}

/* ============ TOAST & BURST ============ */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(150%);
  background:var(--white);border:3px solid var(--ink);border-radius:26px;padding:12px 22px;font-weight:800;
  box-shadow:5px 5px 0 var(--ink);transition:transform .25s;z-index:120;max-width:90vw
}
.toast.show{transform:translateX(-50%) translateY(0)}
.burst{
  position:fixed;pointer-events:none;z-index:130;font-family:var(--display);font-size:2.4rem;
  color:var(--yellow);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--red);
  animation:burst .7s ease-out forwards
}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3) rotate(-15deg);opacity:1}
  70%{transform:translate(-50%,-120%) scale(1.2) rotate(6deg);opacity:1}
  100%{transform:translate(-50%,-150%) scale(1) rotate(6deg);opacity:0}}

/* ============ FOOTER ============ */
footer{background:var(--ink);color:var(--white);padding:30px 0;font-size:.9rem}
footer .logo{font-size:1.6rem;display:inline-block;margin-bottom:8px}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

/* ============ RESPONSIVE ============ */
@media (max-width:860px){
  .splash,.shop,.pdp,.two-col{grid-template-columns:1fr}
  .splash-main{grid-row:auto}
  .filters,.summary{position:static}
  .form-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

    tee:`<path d="M60 50 L85 40 Q100 56 115 40 L140 50 L166 82 L145 97 L140 90 L140 166 L60 166 L60 90 L55 97 L34 82 Z" fill="${a}" ${s}/>
         <circle cx="100" cy="105" r="22" fill="${b}" ${s}/>`,

         <path d="M78 60 Q100 38 122 60 Q100 76 78 60Z" fill="${b}" ${s}/>
         <rect x="76" y="126" width="48" height="26" rx="4" fill="${b}" ${s}/><line x1="100" y1="72" x2="100" y2="170" stroke="#000" stroke-width="3"/>`,
    mug:`<path d="M130 88 Q162 88 160 115 Q158 140 130 138" fill="none" ${s} stroke-width="8"/>
         <rect x="52" y="70" width="84" height="96" rx="8" fill="${a}" ${s}/>
         <path d="M70 110 L88 96 L84 112 L104 100 L96 124" fill="none" stroke="${b}" stroke-width="5" stroke-linecap="round"/>
         <path d="M78 58 Q72 48 80 38 M98 58 Q92 46 100 34 M118 58 Q112 48 120 38" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>`,
    lamp:`<circle cx="100" cy="82" r="48" fill="${a}" opacity=".25"/><circle cx="100" cy="82" r="34" fill="#fff" ${s}/>
         <circle cx="100" cy="82" r="20" fill="${a}" ${s}/><circle cx="100" cy="82" r="8" fill="#fff"/>
         <rect x="94" y="116" width="12" height="38" fill="${b}" ${s}/><rect x="60" y="152" width="80" height="16" rx="6" fill="${b}" ${s}/>`,
    cap:`<path d="M46 124 Q50 62 100 60 Q150 62 154 124 Z" fill="${a}" ${s}/>
         <path d="M40 124 Q110 112 178 130 L172 142 Q108 128 40 136 Z" fill="${b}" ${s}/>

    bag:`<path d="M80 58 Q80 34 100 34 Q120 34 120 58" fill="none" ${s} stroke-width="7"/>

    figure:`<rect x="44" y="30" width="112" height="146" fill="${b}" ${s}/><rect x="58" y="46" width="84" height="104" fill="#E9F6FF" ${s}/>
         <circle cx="100" cy="68" r="11" fill="${a}" ${s}/><path d="M84 82 H116 L112 118 H88 Z" fill="${a}" ${s}/>

         <rect x="62" y="142" width="76" height="16" fill="${b}" ${s}/></g>`,
    band:`<ellipse cx="100" cy="104" rx="60" ry="42" fill="none" stroke="#000" stroke-width="22"/>
         <ellipse cx="100" cy="104" rx="60" ry="42" fill="none" stroke="${a}" stroke-width="14"/>

    keychain:`<circle cx="100" cy="46" r="18" fill="none" ${s} stroke-width="6"/><line x1="100" y1="64" x2="100" y2="80" stroke="#000" stroke-width="5"/>

const state = { cart: [], lastOrder: null };

const OFFER_MIN_ITEMS = 3, OFFER_RATE = 0.15;

const $ = s => document.querySelector(s);
const rupee = n => "₹" + Math.round(n).toLocaleString("en-IN");
const byId = id => PRODUCTS.find(p => p.id === +id);
const heroTag = h => `<span class="tag" style="background:${HEROES[h].color}">${h}</span>`;
const stars = r => "★".repeat(Math.round(r)) + "☆".repeat(5-Math.round(r));
const off = p => Math.round((1 - p.price/p.mrp) * 100);

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
function burst(e){
  const words = ["POW!","BAM!","ZAP!","KAPOW!","WHAM!"];
  const b = document.createElement("div");
  b.className = "burst"; b.textContent = words[Math.floor(Math.random()*words.length)];
  const r = e.target.getBoundingClientRect();
  b.style.left = (r.left + r.width/2) + "px"; b.style.top = r.top + "px";
  document.body.appendChild(b); setTimeout(()=>b.remove(), 750);
}

/* ---- cart logic ---- */
function addToCart(id, qty=1, size=null){
  const p = byId(id);
  if(p.sizes && !size) size = p.sizes[1] || p.sizes[0];
  const key = id + "-" + (size||"");
  const item = state.cart.find(i => i.key === key);
  const before = totals().items;
  item ? item.qty += qty : state.cart.push({key, id:+id, qty, size});
  updateCount();
  if(before < OFFER_MIN_ITEMS && totals().items >= OFFER_MIN_ITEMS)
    setTimeout(()=>toast("Offer unlocked: 15% off your order!"), 2300);
}
function totals(){
  const items = state.cart.reduce((s,i)=> s + i.qty, 0);
  const subtotal = state.cart.reduce((s,i)=> s + byId(i.id).price * i.qty, 0);
  const discount = items >= OFFER_MIN_ITEMS ? subtotal * OFFER_RATE : 0;
  return {items, subtotal, discount, shipping: 0, total: subtotal - discount};
}
function updateCount(){ $("#cartCount").textContent = state.cart.reduce((s,i)=>s+i.qty,0); }

function filterShop(){
  const cat = document.querySelector('input[name="cat"]:checked').value;
  const hero = $("#heroSel").value, q = $("#search").value.toLowerCase().trim();
  const max = +$("#priceRange").value, sort = $("#sort").value;
  $("#priceVal").textContent = rupee(max);
  let list = PRODUCTS.filter(p =>
    (cat==="All"||p.cat===cat) && (hero==="All"||p.hero===hero) && p.price<=max &&
    (p.name+p.hero+p.cat).toLowerCase().includes(q));
  if(sort==="low") list.sort((a,b)=>a.price-b.price);
  if(sort==="high") list.sort((a,b)=>b.price-a.price);
  if(sort==="rating") list.sort((a,b)=>b.rating-a.rating);
  $("#shopGrid").innerHTML = list.length ? list.map(productCard).join("")
    : `<div class="panel empty"><h2>No gear found</h2><p>Try a different hero, category or a higher price limit.</p></div>`;
}

        </div>
        <div id="pay-cod" hidden>
          <div class="cod-note">Pay in cash or by UPI when your order arrives. A ₹49 handling fee applies to cash-on-delivery orders.</div>
        </div>
      </section>
    </div>
    <div>
      ${Summary(t,false)}
      <button class="btn red" id="placeOrder" style="width:100%;margin-top:18px">Pay ${rupee(t.total)}</button>
    </div>
  </div>`;
}

function Success(){
  const o = state.lastOrder;
  if(!o) return `<div class="panel empty"><h2>No recent order</h2><a class="btn" href="#/shop">Start shopping</a></div>`;
  return `
  <ol class="steps"><li class="done">Cart</li><li class="done">Address &amp; payment</li><li class="done">Confirmation</li></ol>
  <section class="success-hero panel">
    <h1>Order placed!</h1>
    <p style="font-size:1.15rem">Thanks, ${o.name}. Your gear is on its way.</p>
  </section>
  <div class="two-col">
    <div class="panel form-panel">
      <h3>Order ${o.id}</h3>
      <p>Paid via <strong>${o.method}</strong> · Arriving by <strong>${o.eta}</strong></p>
      <p>Delivering to ${o.addr}</p>
      <ul class="track"><li class="done">Order placed</li><li>Packed</li><li>Shipped</li><li>Out for delivery</li><li>Delivered</li></ul>
      ${o.items.map(i=>`<div class="row"><span>${byId(i.id).name}${i.size?" ("+i.size+")":""} × ${i.qty}</span><span>${rupee(byId(i.id).price*i.qty)}</span></div>`).join("")}
      <div class="row total"><span>Total paid</span><span>${rupee(o.total)}</span></div>
    </div>
    <div class="panel form-panel" style="text-align:center">
      <span class="bubble">A confirmation has been sent to ${o.email}</span>
      <p style="margin:26px 0 14px">Need more gear?</p>
      <a class="btn" href="#/shop">Continue shopping</a>
    </div>
  </div>`;
}

/* =========================================================
   5. CHECKOUT VALIDATION + PAYMENT SIMULATION
   ========================================================= */
let payMethod = "upi", upiApp = "GPay";
const luhn = n => { let s=0, alt=false; for(let i=n.length-1;i>=0;i--){ let d=+n[i]; if(alt){d*=2; if(d>9)d-=9;} s+=d; alt=!alt; } return s%10===0; };
function setErr(id,msg){
  const el = $("#"+id), e = document.querySelector(`[data-for="${id}"]`);
  el.classList.toggle("bad", !!msg); e.textContent = msg || ""; return !msg;
}
function validate(){
  const v = id => $("#"+id).value.trim();
  let ok = true;
  ok &= setErr("name", v("name").length<3 ? "Enter your full name" : "");
  ok &= setErr("phone", /^[6-9]\d{9}$/.test(v("phone").replace(/\s/g,"")) ? "" : "Enter a valid 10-digit mobile number");
  ok &= setErr("email", /^\S+@\S+\.\S+$/.test(v("email")) ? "" : "Enter a valid email address");
  ok &= setErr("addr", v("addr").length<8 ? "Enter your full address" : "");
  ok &= setErr("city", v("city").length<2 ? "Enter your city" : "");
  ok &= setErr("pin", /^[1-9]\d{5}$/.test(v("pin")) ? "" : "Enter a valid 6-digit PIN code");
  if(payMethod==="upi" && v("upi")) ok &= setErr("upi", /^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(v("upi")) ? "" : "Enter a valid UPI ID, like name@okbank");
  if(payMethod==="card"){
    const num = v("cardNum").replace(/\s/g,"");
    ok &= setErr("cardNum", num.length>=13 && luhn(num) ? "" : "Card number is invalid. Check the digits");
    ok &= setErr("cardName", v("cardName").length<3 ? "Enter the name on your card" : "");
    const [mm,yy] = v("cardExp").split("/").map(Number), now = new Date();
    const valid = mm>=1 && mm<=12 && yy && new Date(2000+yy, mm) > now;
    ok &= setErr("cardExp", valid ? "" : "Enter a future expiry date as MM/YY");
    ok &= setErr("cardCvv", /^\d{3,4}$/.test(v("cardCvv")) ? "" : "CVV is 3 or 4 digits");
  }
  return !!ok;
}
function placeOrder(){
  if(!validate()){ toast("Fix the highlighted fields to continue"); document.querySelector(".bad")?.focus(); return; }
  const msg = payMethod==="upi" ? `Waiting for you to approve the request on ${ $("#upi").value.trim() ? "your UPI app" : upiApp }…`
            : payMethod==="card" ? "Verifying your card with the bank…" : "Confirming your order…";
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="panel"><div class="spinner"></div><h3 style="font-size:1.8rem">Processing payment</h3><p>${msg}</p><p><small>Don't close or refresh this page.</small></p></div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{
    const t = totals(), eta = new Date(Date.now() + 4*864e5);
    state.lastOrder = {
      id: "#MM" + Math.floor(100000 + Math.random()*900000),
      name: $("#name").value.trim().split(" ")[0], email: $("#email").value.trim(),
      addr: `${$("#addr").value.trim()}, ${$("#city").value.trim()} ${$("#pin").value.trim()}`,
      method: payMethod==="upi" ? "UPI" : payMethod==="card" ? "Card ending " + $("#cardNum").value.replace(/\s/g,"").slice(-4) : "Cash on delivery",
      total: t.total + (payMethod==="cod" ? 49 : 0),
      eta: eta.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"}),
      items: state.cart.map(i=>({...i}))
    };
    state.cart = []; updateCount();
    ov.remove(); location.hash = "#/success";
  }, 2400);
}

/* =========================================================
   6. ROUTER (hash-based, works on GitHub Pages)
   ========================================================= */
function router(){
  const [path, qs] = (location.hash.slice(1) || "/").split("?");
  const query = new URLSearchParams(qs || "");
  const parts = path.split("/").filter(Boolean);
  const app = $("#app");
  let page = "home";
  if(parts[0]==="shop"){ app.innerHTML = Shop(query); page="shop"; filterShop(); }
  else if(parts[0]==="product"){ app.innerHTML = Product(parts[1]); page="shop"; }
  else if(parts[0]==="cart"){ app.innerHTML = Cart(); page="cart"; }
  else if(parts[0]==="checkout"){ app.innerHTML = Checkout(); page="cart"; }
  else if(parts[0]==="success"){ app.innerHTML = Success(); page="cart"; }
  else app.innerHTML = Home();
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("active", a.dataset.nav===page));
  window.scrollTo(0,0);
  pdpQty = 1; payMethod = "upi"; upiApp = "GPay";
}
let pdpQty = 1;

/* =========================================================
   7. EVENT HANDLING (one listener for the whole app)
   ========================================================= */
document.addEventListener("click", e => {
  const d = e.target.closest("button")?.dataset || {};
  if(d.add){ addToCart(d.add); burst(e); toast(`${byId(d.add).name} added to cart`); }
  if(d.buy){ addToCart(d.buy); location.hash = "#/checkout"; }
  if(d.inc||d.dec){ const i = state.cart.find(x=>x.key===(d.inc||d.dec)); i.qty += d.inc?1:-1;
    if(i.qty<1) state.cart = state.cart.filter(x=>x!==i); updateCount(); router(); }
  if(d.rm){ state.cart = state.cart.filter(x=>x.key!==d.rm); updateCount(); router(); toast("Item removed"); }
  if(d.size){ document.querySelectorAll("#sizes .opt").forEach(b=>b.classList.toggle("sel", b===e.target)); }
  if(d.tab){ payMethod = d.tab;
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.tab===d.tab));
    ["upi","card","cod"].forEach(m=> $("#pay-"+m).hidden = m!==d.tab);
    const t = totals(); $("#placeOrder").textContent = d.tab==="cod" ? `Place order (${rupee(t.total+49)})` : `Pay ${rupee(t.total)}`; }
  if(d.app){ upiApp = d.app; document.querySelectorAll("[data-app]").forEach(b=>b.classList.toggle("sel", b===e.target)); }
  const id = e.target.id;
  if(id==="qPlus"||id==="qMinus"){ pdpQty = Math.max(1, Math.min(10, pdpQty + (id==="qPlus"?1:-1))); $("#qVal").textContent = pdpQty; }
  if(id==="pdpAdd"||id==="pdpBuy"){
    const pid = location.hash.split("/")[2], size = document.querySelector("#sizes .sel")?.dataset.size;
    addToCart(pid, pdpQty, size);
    if(id==="pdpBuy") location.hash = "#/checkout"; else { burst(e); toast(`Added ${pdpQty} to cart`); }
  }
  if(id==="placeOrder") placeOrder();
});

document.addEventListener("input", e => {
  if(["search","priceRange","heroSel","sort"].includes(e.target.id) || e.target.name==="cat") filterShop();
  const id = e.target.id;
  if(id==="cardNum"){
    const n = e.target.value.replace(/\D/g,"").slice(0,16);
    e.target.value = n.replace(/(.{4})/g,"$1 ").trim();
    $("#cNum").textContent = (n + "•".repeat(16-n.length)).replace(/(.{4})/g,"$1 ").trim();
    $("#cBrand").textContent = /^4/.test(n) ? "VISA" : /^5[1-5]/.test(n) ? "MASTERCARD" : /^6/.test(n) ? "RUPAY" : "CARD";
  }
  if(id==="cardName") $("#cName").textContent = e.target.value.toUpperCase() || "YOUR NAME";
  if(id==="cardExp"){
    let v = e.target.value.replace(/\D/g,"").slice(0,4);
    if(v.length>2) v = v.slice(0,2) + "/" + v.slice(2);
    e.target.value = v; $("#cExp").textContent = v || "MM/YY";
  }
});
document.addEventListener("change", e => { if(e.target.name==="cat"||e.target.id==="heroSel"||e.target.id==="sort") filterShop(); });

window.addEventListener("hashchange", router);
router();
</script>
